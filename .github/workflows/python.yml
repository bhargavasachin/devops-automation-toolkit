name: Python checks

on:
  pull_request:
    paths:
      - '**.py'
      - 'examples/**'
      - '.github/workflows/python.yml'
  push:
    branches:
      - main
    paths:
      - '**.py'
      - 'examples/**'
      - '.github/workflows/python.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m compileall -q python
